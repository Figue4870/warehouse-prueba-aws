[pytest]
# Correr desde la raíz del repositorio:
#   pytest tests/unit          -> no necesita Docker (SQLite en memoria + Redis falso)
#   pytest tests/central       -> plataforma central, tampoco necesita Docker
#   pytest tests/integration   -> necesita la bodega corriendo (docker compose ... up)
testpaths = tests/unit tests/central tests/integration
pythonpath = src/backend/app src/common src/central
addopts = -ra
markers =
    integration: pruebas contra la API real (PostgreSQL + Redis) levantada con Docker
filterwarnings =
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively
