# =====================================================================
# PLANTILLA ÚNICA DE UNA BODEGA (Fases 1 a 7)
#
# La MISMA plantilla sirve para todas las bodegas; lo que cambia es el .env:
#
#   docker compose --env-file docker/components/wh_002/.env \
#                  -f docker/composes/compose-warehouse.yml -p wh-002 up -d --build
#
# (o simplemente:  ./manage_warehouse.sh start wh_002   /   .\manage.ps1 start wh_002)
#
# Cada bodega queda en su propio "proyecto" de Docker (-p wh-002), con su propia
# red y sus propios volúmenes: las bodegas NO comparten base de datos, caché ni
# broker (autonomía, Fase 4). Es el mismo archivo que se usó en el laboratorio
# de AWS: una bodega por máquina EC2.
#
#   postgres_db   PostgreSQL: fuente de verdad (inventario + outbox de eventos)
#   redis         Redis: caché de lecturas
#   rabbitmq      RabbitMQ interno de la bodega (Fase 3)
#   api_1..api_3  3 instancias IDÉNTICAS de la API (Fase 5)
#   lb            Nginx: balanceador de carga delante de las 3 APIs (Fase 5)
#   outbox_relay, cache_worker, notification_worker, report_worker, audit_worker  (Fase 3)
#   frontend      página web; llama a la API a través del balanceador
#   central_forwarder  reenvía TODOS los eventos al RabbitMQ central (Fase 7, store-and-forward)
#   command_worker     ejecuta los pasos de las transferencias que ordena la central (Fase 6, Saga)
#
# Red "warehouse_platform" (externa, compartida con la central): la usan el
# forwarder y el command_worker (para llegar al RabbitMQ central) y el
# balanceador (para que la central pueda pedir /sync a esta bodega). Los scripts la crean si no existe;
# a mano: docker network create warehouse_platform
#
# Las rutas (../../) son relativas a ESTE archivo.
# Formato ${VARIABLE:-valor}: si el .env no la trae, se usa el valor por defecto.
# =====================================================================

# Configuración común de la API y los workers (misma imagen, distinto comando)
x-backend: &backend
  build:
    context: ../../src
    dockerfile: backend/app/Dockerfile
  environment: &backend-env
    WAREHOUSE_ID: ${WH_ID}
    DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres_db:5432/${DB_NAME:-warehouse_db}
    AUTO_CREATE_TABLES: "false"          # las tablas las crea db/schema.sql
    REDIS_URL: redis://redis:6379/0
    CACHE_ENABLED: ${CACHE_ENABLED:-true}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    CACHE_INVALIDATION_MODE: ${CACHE_INVALIDATION_MODE:-both}
    AMQP_URL: amqp://${RABBIT_USER:-warehouse}:${RABBIT_PASSWORD:-warehouse}@rabbitmq:5672/%2F
    REPORT_SIMULATED_DELAY_SECONDS: ${REPORT_SIMULATED_DELAY_SECONDS:-0}
    # Fase 7: RabbitMQ de la central y URL con la que la central llama a esta bodega
    CENTRAL_AMQP_URL: ${CENTRAL_AMQP_URL:-amqp://platform:platform@central_rabbitmq:5672/%2F}
    ADVERTISED_API_URL: ${ADVERTISED_API_URL:-}
    HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-15}
  restart: unless-stopped

# Las 3 instancias de la API son idénticas (stateless): solo cambia su nombre
x-api: &api
  <<: *backend
  depends_on:
    postgres_db:
      condition: service_healthy           # sin BD la bodega no puede operar
    redis:
      condition: service_started           # Redis es opcional: la API funciona sin él
  # La API NO depende de RabbitMQ: escribe los eventos en el outbox (PostgreSQL)
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 3

x-worker-deps: &worker-deps
  postgres_db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: db_warehouse_${WH_ID}
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-warehouse_db}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # schema.sql se ejecuta SOLO la primera vez (cuando el volumen está vacío)
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # carpeta db/ visible dentro del contenedor (seed.sql y migraciones)
      - ../../db:/db:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 => espera al servidor definitivo y no al temporal que corre schema.sql
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-warehouse_db} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_warehouse_${WH_ID}
    # Caché pura: sin persistencia, máximo 64 MB y expulsa las claves menos usadas.
    # UN Redis por bodega, compartido por las 3 APIs (si cada API tuviera el suyo,
    # una invalidación en api_1 dejaría datos viejos en api_2 y api_3).
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_warehouse_${WH_ID}
    # hostname fijo: RabbitMQ guarda sus datos por nombre de nodo; así las colas
    # durables y sus mensajes sobreviven a un "down/up"
    hostname: rabbitmq-${WH_ID}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-warehouse}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-warehouse}
    ports:
      - "${RABBIT_PORT:-5673}:5672"          # AMQP (para scripts/dlq.py desde tu PC)
      - "${RABBIT_MGMT_PORT:-15673}:15672"   # Consola web de RabbitMQ
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------- Fase 5: 3 instancias de la API + balanceador ----------------
  api_1:
    <<: *api
    container_name: warehouse_api_1_${WH_ID}
    environment:
      <<: *backend-env
      INSTANCE_NAME: ${WH_ID}-api-1

  api_2:
    <<: *api
    container_name: warehouse_api_2_${WH_ID}
    environment:
      <<: *backend-env
      INSTANCE_NAME: ${WH_ID}-api-2

  api_3:
    <<: *api
    container_name: warehouse_api_3_${WH_ID}
    environment:
      <<: *backend-env
      INSTANCE_NAME: ${WH_ID}-api-3

  lb:
    image: nginx:1.27-alpine
    container_name: lb_warehouse_${WH_ID}
    ports:
      - "${BE_PORT}:80"                    # la API de la bodega se publica a través del balanceador
    volumes:
      - ../nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    # En "platform" la central lo encuentra como http://lb_warehouse_<WH_ID>:80
    networks: [default, platform]
    depends_on:
      - api_1
      - api_2
      - api_3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------------- Fase 3: relay y workers ----------------
  outbox_relay:
    <<: *backend
    container_name: outbox_relay_${WH_ID}
    command: ["python", "-m", "app.workers.relay"]
    depends_on: *worker-deps

  cache_worker:
    <<: *backend
    container_name: cache_worker_${WH_ID}
    command: ["python", "-m", "app.workers.cache_worker"]
    depends_on: *worker-deps

  notification_worker:
    <<: *backend
    container_name: notification_worker_${WH_ID}
    command: ["python", "-m", "app.workers.notification_worker"]
    depends_on: *worker-deps

  report_worker:
    <<: *backend
    container_name: report_worker_${WH_ID}
    command: ["python", "-m", "app.workers.report_worker"]
    depends_on: *worker-deps

  audit_worker:
    <<: *backend
    container_name: audit_worker_${WH_ID}
    command: ["python", "-m", "app.workers.audit_worker"]
    depends_on: *worker-deps

  # ---------------- Fase 7: puente hacia la central ----------------
  central_forwarder:
    <<: *backend
    container_name: central_forwarder_${WH_ID}
    command: ["python", "-m", "app.workers.central_forwarder"]
    networks: [default, platform]
    depends_on: *worker-deps

  # ---------------- Fase 6: pasos de la Saga de transferencias ----------------
  command_worker:
    <<: *backend
    container_name: command_worker_${WH_ID}
    command: ["python", "-m", "app.workers.command_worker"]
    networks: [default, platform]           # escucha la cola commands.<WH_ID> del RabbitMQ CENTRAL
    depends_on:
      postgres_db:
        condition: service_healthy

  frontend:
    build:
      context: ../../src/frontend/app
      dockerfile: Dockerfile
    container_name: warehouse_frontend_${WH_ID}
    ports:
      - "${FE_PORT}:80"
    environment:
      # Nginx del frontend reenvía /api/* al BALANCEADOR (no a una API en particular)
      API_TARGET: lb:80
    depends_on:
      - lb
    restart: unless-stopped

networks:
  platform:
    name: warehouse_platform
    external: true

volumes:
  pgdata:
  rabbitdata:
