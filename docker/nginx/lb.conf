# =====================================================================
# BALANCEADOR DE CARGA de UNA bodega (Fase 5)
#
#                 navegador / clientes / central
#                              |
#                         lb (Nginx :80)
#                 +------------+------------+
#                 |            |            |
#               api_1        api_2        api_3      (3 copias IDÉNTICAS y stateless)
#                 +------------+------------+
#                              |
#                    PostgreSQL + Redis + RabbitMQ
#
# Reparte por turnos (round-robin). Si una instancia no responde, Nginx:
#   - reintenta esa petición en la siguiente (proxy_next_upstream), y
#   - deja de enviarle tráfico durante 10 s después de 2 fallos (max_fails / fail_timeout).
# =====================================================================

# DNS interno de Docker. Con "resolve", Nginx vuelve a preguntar la IP cada 10 s:
# si una instancia se reinicia con otra IP, el balanceador la encuentra solo.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream warehouse_api {
    zone warehouse_api 64k;    # memoria compartida (la necesita "resolve")
    server api_1:8000 resolve max_fails=2 fail_timeout=10s;
    server api_2:8000 resolve max_fails=2 fail_timeout=10s;
    server api_3:8000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;              # reutiliza conexiones con las APIs (menos latencia)
}

server {
    listen 80;

    # Salud del propio balanceador (para Docker y para la nube)
    location = /lb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://warehouse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Reintento en otra instancia si esta falla. Nginx NO reintenta un POST que
        # ya llegó a una API (evita registrar un movimiento dos veces); solo lo
        # reintenta si la conexión ni siquiera se pudo abrir.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # Para ver en la respuesta qué instancia atendió (además de X-Instance de la API)
        add_header X-Upstream $upstream_addr always;
    }
}
