# =====================================================================
# Integración continua: en cada push o pull request GitHub ejecuta esto
# en una máquina limpia. Si algo falla, el commit aparece con una ✗ roja.
# =====================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r src/backend/app/requirements-dev.txt
      - name: Bodega (tests/unit) y plataforma central (tests/central)
        run: pytest tests/unit tests/central -q

  config:
    name: Docker Compose, Nginx y Terraform válidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose de cada bodega
        run: |
          docker compose -f basic-docker-compose.yml config -q
          for env in docker/components/wh_*/.env; do
            docker compose --env-file "$env" -f docker/composes/compose-warehouse.yml -p ci config -q
          done
      - name: Compose de la central (Fase 7)
        run: docker compose --env-file docker/components/central/.env -f docker/composes/compose-central.yml -p central config -q
      - name: Configuración del balanceador
        run: docker run --rm -v "$PWD/docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  integration:
    name: Bodega real + pruebas de integración
    runs-on: ubuntu-latest
    needs: [unit-tests, config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r src/backend/app/requirements-dev.txt
      - name: Red compartida bodegas <-> central (Fase 7)
        run: docker network create warehouse_platform
      - name: Construir y levantar la central (Fase 7)
        run: docker compose --env-file docker/components/central/.env -f docker/composes/compose-central.yml -p central up -d --build --wait --wait-timeout 300
      - name: Construir y levantar WH-001 (espera a que todo esté healthy)
        run: docker compose -f basic-docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Levantar WH-002 (destino de la transferencia de prueba, Fase 6)
        run: docker compose --env-file docker/components/wh_002/.env -f docker/composes/compose-warehouse.yml -p wh-002 up -d --build --wait --wait-timeout 300
      - name: Pruebas de integración (bodegas + central + Saga)
        run: pytest tests/integration -q
        env:
          API_URL: http://localhost:8001
          API_URL_2: http://localhost:8002
          REDIS_URL: redis://localhost:6380/0
          CENTRAL_URL: http://localhost:8090
      - name: Logs si algo falló
        if: failure()
        run: |
          docker compose -f basic-docker-compose.yml logs --tail 80
          docker compose --env-file docker/components/wh_002/.env -f docker/composes/compose-warehouse.yml -p wh-002 logs --tail 40
          docker compose --env-file docker/components/central/.env -f docker/composes/compose-central.yml -p central logs --tail 80
      - name: Apagar
        if: always()
        run: |
          docker compose -f basic-docker-compose.yml down -v
          docker compose --env-file docker/components/wh_002/.env -f docker/composes/compose-warehouse.yml -p wh-002 down -v
          docker compose --env-file docker/components/central/.env -f docker/composes/compose-central.yml -p central down -v
